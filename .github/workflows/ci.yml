name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features test-sources -- -D warnings
      - run: cargo test --features test-sources

  # Real kernel capture through the vivid virtual camera driver.
  linux-vivid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Load vivid
        run: |
          sudo apt-get update
          sudo apt-get install -y v4l-utils "linux-modules-extra-$(uname -r)"
          sudo modprobe vivid n_devs=1 node_types=0x1
          # udev applies root:video 0660 asynchronously; let it finish before widening access.
          sudo udevadm settle
          sudo v4l2-ctl -d /dev/video0 --list-formats | head -40
      - name: Cameras the user cannot open are listed with the reason
        run: |
          set +e
          cargo run --example snapshot -- vivid frame.ppm 2>&1 | tee denied.txt
          grep -q "Permission denied" denied.txt
      - name: Grant access
        run: |
          sudo chmod a+rw /dev/video*
          v4l2-ctl --list-devices
      - name: Snapshot through the default mode
        run: cargo run --example snapshot -- vivid frame.ppm
      - name: Every pixel format against RGB24
        run: cargo run --features test-sources --example v4l2_formats -- vivid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-frames
          path: "*.ppm"

  # MJPEG as UVC webcams send it: ffmpeg streams JPEG frames into a v4l2loopback device.
  linux-mjpeg-loopback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Load v4l2loopback
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg v4l-utils v4l2loopback-dkms "linux-headers-$(uname -r)" "linux-modules-extra-$(uname -r)"
          sudo modprobe v4l2loopback video_nr=7 card_label=camlib-loopback exclusive_caps=1
          sudo udevadm settle
          sudo chmod a+rw /dev/video7
      - name: Stream a still image as MJPEG
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=1280x720 -frames:v 1 -y still.png
          ffmpeg -v error -f lavfi -i testsrc2=size=1280x720 -frames:v 1 -pix_fmt rgb24 -f rawvideo -y still.rgb
          nohup ffmpeg -v error -re -loop 1 -i still.png -r 30 -c:v mjpeg -huffman default \
            -pix_fmt yuvj422p -q:v 3 -f v4l2 /dev/video7 > ffmpeg.log 2>&1 &
          sleep 3
          cat ffmpeg.log
          v4l2-ctl -d /dev/video7 --list-formats
      - name: Capture and compare with the source image
        run: |
          cargo build --release --example snapshot
          target/release/examples/snapshot camlib-loopback frame.ppm
          python3 - <<'PY'
          frame = open("frame.ppm", "rb").read().split(b"\n", 3)[3]
          still = open("still.rgb", "rb").read()
          assert len(frame) == len(still), (len(frame), len(still))
          mean = sum(abs(a - b) for a, b in zip(frame, still)) / len(still)
          print(f"mean error against the source image: {mean:.2f}")
          assert mean < 4, "MJPEG capture does not match the source"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mjpeg-frames
          path: "*.ppm"

  # The Media Foundation reader path, fed by a video file since runners have no camera.
  windows-media-foundation:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Enumerate cameras
        run: |
          set +e
          cargo run --example snapshot
          code=$?
          # 1 is "no matching camera"; anything else (such as an access violation) fails.
          [ "$code" -eq 0 ] || [ "$code" -eq 1 ]
      - name: Read a video file as a camera
        run: cargo run --features test-sources --example file_source -- tests/fixtures/clip.mp4 frame.ppm tests/fixtures/clip-frame3.rgb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-frames
          path: "*.ppm"
